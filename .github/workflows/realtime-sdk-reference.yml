name: Realtime SDK Reference

# The hand-written TypeScript SDK page includes seven generated partials under
# content/docs/shared-content/realtime-sdk-*.md. This job renders the vendored TypeDoc
# artifact in memory and byte-compares those partials against the committed copies.
# Drift fails the pull request with the file named.
#
# Offline by design: the check reads vendor/realtime/sdk-docs.json out of the
# repository. Updating the artifact needs a local neon-pkgs checkout
# (`npm run update:realtime-sdk`) and is never a CI step.

on:
  pull_request:
    paths:
      - 'content/docs/realtime/sdks/**'
      - 'content/docs/shared-content/realtime-sdk-*.md'
      - 'vendor/realtime/**'
      - 'config/realtime-sdk.json'
      - 'scripts/*realtime-sdk*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/realtime-sdk-reference.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # mint the JFrog OIDC token for the Databricks npm mirror

jobs:
  check:
    name: 'Check the generated SDK reference against the vendored artifact'
    runs-on:
      group: neondatabase-protected-runner-group
      labels: linux-ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # The protected runner group has no egress to the public npm registry. It
      # can only reach the Databricks JFrog mirror, so mint a short-lived token
      # via OIDC and point npm at the mirror before anything fetches packages.
      - name: Setup JFrog CLI with OIDC
        id: setup-jfrog
        uses: jfrog/setup-jfrog-cli@279b1f629f43dd5bc658d8361ac4802a7ef8d2d5 # v4.9.1
        env:
          JF_URL: https://databricks.jfrog.io
        with:
          oidc-provider-name: github-actions
      - name: Configure npm registry (Databricks JFrog mirror)
        run: |
          cat > ~/.npmrc <<'NPMRC'
          registry=https://databricks.jfrog.io/artifactory/api/npm/db-npm/
          //databricks.jfrog.io/artifactory/api/npm/db-npm/:_authToken=${{ steps.setup-jfrog.outputs.oidc-token }}
          always-auth=true
          NPMRC

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: 'npm'

      # Lockfile only. This job never installs anything the repository does not
      # already depend on.
      - name: Install dependencies
        run: npm ci

      - name: Check generated partials
        run: npm run check:realtime-sdk-reference
