name: Docs reindex

on:
  push:
    branches:
      - main
    paths:
      # Official docs catalog. Guides and changelog are site-reindex.yml.
      - 'content/docs/**'
      - 'content/branching/**'
      # Catalog membership can change without a markdown edit.
      - 'src/constants/content.js'
      - 'src/scripts/llms-index-config.js'
      - 'src/scripts/generate-llms-index.js'
      - 'scripts/generate-api-ref.mjs'
      - 'scripts/lib/api-ref-output.mjs'
      - 'scripts/lib/openapi-spec-source.mjs'
  workflow_dispatch:
    inputs:
      urls:
        description: Space-separated https://neon.com/**.md URLs to reindex (upsert)
        required: false
        type: string
        default: ''
      sync:
        description: Diff the live docs catalog against indexed pages (add missing, drop extras)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  reindex:
    name: 'Reindex changed docs pages'
    runs-on:
      group: neondatabase-protected-runner-group
      labels: linux-ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      - name: Map changed files
        id: map
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -o pipefail
          before="${{ github.event.before }}"
          sha="${{ github.sha }}"
          zeros='0000000000000000000000000000000000000000'
          if [ "${before}" = "${zeros}" ]; then
            echo "github.event.before is the all-zeros SHA; refusing to guess the compare range. Use workflow_dispatch with the https://neon.com/**.md URLs instead."
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/compare/${before}...${sha}" --jq '.files' \
            > /tmp/docs-reindex-files.json
          payload="$(node src/scripts/docs-reindex-map.js < /tmp/docs-reindex-files.json)"
          if [ -z "${payload}" ]; then
            echo "payload=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          {
            echo 'payload<<EOF'
            printf '%s\n' "${payload}"
            echo EOF
          } >> "${GITHUB_OUTPUT}"

      - name: Map dispatch URLs
        id: dispatch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -o pipefail
          node <<'NODE'
          const fs = require('fs');
          (async () => {
            const urls = (process.env.URLS ?? '').trim().split(/\s+/).filter(Boolean);
            const sync = process.env.SYNC === 'true';
            if (urls.length === 0 && !sync) {
              throw new Error(
                'workflow_dispatch requires https://neon.com/**.md URLs and/or sync',
              );
            }
            for (const url of urls) {
              let parsed;
              try {
                parsed = new URL(url);
              } catch {
                throw new Error(
                  `Not a neon.com markdown url: ${url} (expected https://neon.com/**.md with no port, userinfo, query, or hash)`,
                );
              }
              if (
                parsed.protocol !== 'https:' ||
                parsed.hostname !== 'neon.com' ||
                parsed.port !== '' ||
                parsed.username !== '' ||
                parsed.password !== '' ||
                parsed.search !== '' ||
                parsed.hash !== '' ||
                !parsed.pathname.endsWith('.md')
              ) {
                throw new Error(
                  `Not a neon.com markdown url: ${url} (expected https://neon.com/**.md with no port, userinfo, query, or hash)`,
                );
              }
              if (
                parsed.pathname.startsWith('/guides/') ||
                parsed.pathname.startsWith('/docs/changelog/')
              ) {
                throw new Error(
                  `Guide and changelog URLs go to the Site reindex workflow: ${url}`,
                );
              }
            }
            const { toWebhookPayload } = require('./src/scripts/docs-reindex-map.js');
            const payloadObj = toWebhookPayload({
              pages: urls.map((url) => ({ url, deleted: false })),
              sync,
            });
            if (!payloadObj) {
              throw new Error(
                'workflow_dispatch requires https://neon.com/**.md URLs and/or sync',
              );
            }
            const payload = JSON.stringify(payloadObj);
            if (process.env.GITHUB_STEP_SUMMARY) {
              const parts = [];
              if (urls.length > 0) {
                parts.push(`Queued **${urls.length}** page(s) for reindex`);
              }
              if (sync) {
                parts.push(urls.length > 0 ? 'plus catalog sync' : 'Catalog sync queued');
              }
              await fs.promises.appendFile(
                process.env.GITHUB_STEP_SUMMARY,
                `## Docs reindex map\n\n${parts.join(' ')}.\n`,
              );
            }
            await fs.promises.appendFile(
              process.env.GITHUB_OUTPUT,
              `payload<<EOF\n${payload}\nEOF\n`,
            );
          })().catch((error) => {
            console.error(error instanceof Error ? error.message : error);
            process.exit(1);
          });
          NODE
        env:
          URLS: ${{ inputs.urls }}
          SYNC: ${{ inputs.sync }}

      - name: POST reindex
        if: steps.map.outputs.payload != '' || steps.dispatch.outputs.payload != ''
        env:
          NEON_AGENT_DOCS_REINDEX_URL: ${{ secrets.NEON_AGENT_DOCS_REINDEX_URL }}
          NEON_AGENT_DOCS_REINDEX_SECRET: ${{ secrets.NEON_AGENT_DOCS_REINDEX_SECRET }}
          PAYLOAD: ${{ steps.map.outputs.payload || steps.dispatch.outputs.payload }}
        shell: bash
        run: |
          set -o pipefail
          if [ -z "${NEON_AGENT_DOCS_REINDEX_URL}" ] || [ -z "${NEON_AGENT_DOCS_REINDEX_SECRET}" ]; then
            echo "NEON_AGENT_DOCS_REINDEX_URL and NEON_AGENT_DOCS_REINDEX_SECRET must be set"
            exit 1
          fi
          node <<'NODE'
          const { createHmac } = require('node:crypto');
          const body = process.env.PAYLOAD;
          const signature = `sha256=${createHmac('sha256', process.env.NEON_AGENT_DOCS_REINDEX_SECRET)
            .update(body)
            .digest('hex')}`;
          (async () => {
            const response = await fetch(process.env.NEON_AGENT_DOCS_REINDEX_URL, {
              method: 'POST',
              headers: {
                'content-type': 'application/json',
                'x-docs-reindex-signature': signature,
              },
              body,
            });
            await response.arrayBuffer();
            if (response.status !== 202) {
              throw new Error(`docs reindex returned ${response.status}`);
            }
            console.log(`docs reindex returned ${response.status}`);
          })().catch((error) => {
            console.error(error instanceof Error ? error.message : error);
            process.exit(1);
          });
          NODE
