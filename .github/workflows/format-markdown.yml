name: Check Markdown Formatting

# Read-only CI gate: fails when content markdown isn't Prettier-formatted.
# Contributors format locally with `npm run fix:md` and commit the result.
# No write token / PAT is required because this job never pushes.

on:
  pull_request:
    paths:
      - 'content/**/*.md'
      - '.github/workflows/format-markdown.yml'

permissions:
  contents: read
  id-token: write # mint the JFrog OIDC token for the Databricks npm mirror

jobs:
  check-formatting:
    name: 'Check content markdown is Prettier-formatted'
    runs-on:
      group: neondatabase-protected-runner-group
      labels: linux-ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # The protected runner group has no egress to the public npm registry — it
      # can only reach the Databricks JFrog mirror. Mint a short-lived token via
      # OIDC and point npm at the mirror before anything fetches packages.
      - name: Setup JFrog CLI with OIDC
        id: setup-jfrog
        uses: jfrog/setup-jfrog-cli@279b1f629f43dd5bc658d8361ac4802a7ef8d2d5 # v4.9.1
        env:
          JF_URL: https://databricks.jfrog.io
        with:
          oidc-provider-name: github-actions
      - name: Configure npm registry (Databricks JFrog mirror)
        run: |
          cat > ~/.npmrc <<EOF
          registry=https://databricks.jfrog.io/artifactory/api/npm/db-npm/
          //databricks.jfrog.io/artifactory/api/npm/db-npm/:_authToken=${{ steps.setup-jfrog.outputs.oidc-token }}
          always-auth=true
          EOF

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: |
          npm run check:md || {
            echo "::error::Content markdown is not Prettier-formatted. Run 'npm run fix:md' locally and commit the result."
            exit 1
          }
