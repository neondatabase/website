name: Check updatedOn stamps

# Read-only CI check: warns, without failing, when a changed content page kept its old
# updatedOn stamp. Each stale page gets a warning annotation and a row in the job summary.
# The pre-commit hook stamps pages, but GitHub web edits, commits that skip hooks, and
# checkouts without hooks set up don't run it. See scripts/check-updated-on.mjs.

on:
  pull_request:
    paths:
      - 'content/**/*.md'
      - 'content/**/*.mdx'
      - 'scripts/check-updated-on.mjs'
      - '.github/workflows/check-updated-on.yml'

permissions:
  contents: read

jobs:
  check:
    name: 'Warn on stale updatedOn stamps'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('{"group":"databricks-ghec-untrusted-runner-group","labels":"linux-ubuntu-latest-untrusted-2core-8gb"}') }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # The PR merge commit's first parent is the base branch, so a depth of 2 is
      # enough to diff the PR's changes without fetching history.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2

      # The check uses only git and Node built-ins, so there's no npm install.
      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22

      - name: Check updatedOn stamps
        env:
          BASE_REF: HEAD^1
        run: node scripts/check-updated-on.mjs --warn
