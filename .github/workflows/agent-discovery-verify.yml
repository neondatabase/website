name: Agent Discovery Verify

# Single flow that verifies every agent / discovery endpoint cataloged in
# config/agent-endpoints.yaml stays correct and in sync with the source of truth
# (src/constants/agent-discovery.js). Covers skills, MCP, API/OpenAPI, OAuth,
# the AI-Gateway model catalog, and llms.txt.
#
#   - Pull requests touching a discovery surface -> offline verification (fast,
#     no network): schema + source-of-truth consistency + committed artifacts.
#   - Daily schedule / manual dispatch -> --live: additionally fetches neon.com
#     and checks how far the models.dev mirror has fallen behind /models.json.
#     Opens/updates a tracking issue on failure so drift can't rot silently.
#
# /models.json is a source of truth, not a mirror of models.dev, so the two are
# expected to differ whenever we have shipped a model and the upstream PR has not
# merged. That lag does not fail the run — it is reported on its own issue, which
# closes when the mirror catches up. A red run means something else: models.dev
# advertising a `neon` model we do not publish, or a catalog that is malformed.

on:
  pull_request:
    paths:
      - 'config/agent-endpoints.yaml'
      - 'src/constants/agent-discovery.js'
      - 'scripts/verify-agent-endpoints.mjs'
      - 'src/app/.well-known/**'
      - 'public/auth.md'
      - 'src/app/models.json/**'
      - 'src/app/models/**'
      - 'src/scripts/generate-skills-index.js'
      - 'src/scripts/check-models-sync.mjs'
      - 'src/scripts/check-models-endpoint-sync.js'
      - 'src/scripts/import-models-from-models-dev.mjs'
      - 'scripts/lib/models-catalog.mjs'
      - 'next.config.js'
  schedule:
    # Every day at 8:00 AM UTC (matches the old AI Gateway Models Sync cadence)
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # mint the JFrog OIDC token for the Databricks npm mirror
  issues: write

jobs:
  verify:
    name: 'Verify agent-discovery endpoints'
    runs-on:
      group: neondatabase-protected-runner-group
      labels: linux-ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # The protected runner group has no egress to the public npm registry — it
      # can only reach the Databricks JFrog mirror. Mint a short-lived token via
      # OIDC and point npm at the mirror before anything fetches packages.
      - name: Setup JFrog CLI with OIDC
        id: setup-jfrog
        uses: jfrog/setup-jfrog-cli@279b1f629f43dd5bc658d8361ac4802a7ef8d2d5 # v4.9.1
        env:
          JF_URL: https://databricks.jfrog.io
        with:
          oidc-provider-name: github-actions
      - name: Configure npm registry (Databricks JFrog mirror)
        run: |
          cat > ~/.npmrc <<EOF
          registry=https://databricks.jfrog.io/artifactory/api/npm/db-npm/
          //databricks.jfrog.io/artifactory/api/npm/db-npm/:_authToken=${{ steps.setup-jfrog.outputs.oidc-token }}
          always-auth=true
          EOF

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # pipefail is required: without it the shell returns tee's exit code, node's
      # failure is discarded, and the job reports success even when verification
      # crashes. That masked a partial npm install (ERR_MODULE_NOT_FOUND on ajv)
      # for months, so no drift was ever reported.
      # PRs: offline verification only (deterministic, no network dependency).
      # The catalog classification and validation rules are pure functions with
      # their own tests. unit-tests.yml only runs weekly, so without this a
      # regression in either could merge unnoticed.
      - name: Test the catalog rules
        shell: bash
        run: npx vitest run scripts/lib/models-catalog.test.js

      - name: Verify (offline)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -o pipefail
          node scripts/verify-agent-endpoints.mjs | tee verify-report.txt

      # Schedule / manual: full live verification incl. models.dev sync.
      - name: Verify (live)
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -o pipefail
          node scripts/verify-agent-endpoints.mjs --live | tee verify-report.txt

      # Sync debt is expected and non-failing, so it needs a channel of its own or
      # nobody would ever see it. Runs even when the step above failed, because an
      # unrelated endpoint failure should not hide how far the mirror has drifted.
      - name: Report models.dev mirror sync debt
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          status=0
          node src/scripts/check-models-sync.mjs --ci > mirror-report.txt 2>&1 || status=$?
          # Exit 1 is a fault and exit 2 is an unreadable catalog; both are
          # reported by the verify step above. Only act on the issue when the
          # comparison actually succeeded, or a failed read would look like a
          # mirror that has caught up and close the issue.
          if [ "${status}" -ne 0 ]; then
            echo "sync check exited ${status}; leaving the tracking issue untouched"
            cat mirror-report.txt
            # The drift issue is opened from verify-report.txt by the next step.
            # That file describes the earlier run, which succeeded, so append this
            # failure or the issue would describe a healthy check.
            {
              printf '\n## models.dev mirror check failed (exit %s)\n\n' "${status}"
              cat mirror-report.txt
            } >> verify-report.txt
            exit "${status}"
          fi
          title="models.dev mirror is behind neon.com/models.json"
          existing="$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number')"
          if grep -q '\[SYNC DEBT\]' mirror-report.txt; then
            body="$(cat mirror-report.txt)"
            body="${body}"$'\n\n'"— Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            if [ -n "${existing}" ]; then
              gh issue comment "${existing}" --body "${body}"
            else
              gh issue create --title "${title}" --body "${body}"
            fi
          elif [ -n "${existing}" ]; then
            gh issue close "${existing}" --comment "models.dev now mirrors the published catalog."
          fi

      - name: Open or update drift issue
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Agent-discovery endpoint drift detected"
          body="$(cat verify-report.txt 2>/dev/null || echo 'The agent-discovery verification failed. See the workflow run for details.')"
          body="${body}"$'\n\n'"— Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          existing="$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number' 2>/dev/null || echo '')"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
          else
            gh issue create --title "${title}" --body "${body}"
          fi
