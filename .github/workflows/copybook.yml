name: Copybook

# Copybook (https://copybook.dev) tracks the prompts the site shows and copies.
#
# - `copybook check` fails when the snapshot of a prompt defined in code
#   (src/constants/agent-prompts.mjs) is stale, and warns when a prompt in
#   public/prompts is deleted or renamed without an alias. Markdown prompts are
#   their own snapshots, so editing one never needs a snapshot update.
# - `copybook test` syntax-checks the shell blocks in the prompts the PR changes.
#   Placeholders for the agent, such as <agent>, count as plain words.
# - `copybook report` posts, and then updates, one comment with the rendered
#   before and after of every prompt the PR changes, the pages that use it, and
#   any prompt it removed, with the URL that no longer works. Forks get the
#   report in the job summary instead, because their token can't comment.

on:
  pull_request:
    paths:
      - 'public/prompts/**'
      - 'src/constants/agent-prompts.mjs'
      - 'copybook/**'
      - 'copybook.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/copybook.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # mint the JFrog OIDC token for the Databricks npm mirror
  pull-requests: write # post the Copybook report comment

jobs:
  check:
    name: 'Copybook: check prompts'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('{"group":"databricks-ghec-untrusted-runner-group","labels":"linux-ubuntu-latest-untrusted-2core-8gb"}') }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # Full history, so --base can compare against the base branch.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # The protected runner group can only reach the Databricks JFrog mirror.
      # Forks can't mint JFrog credentials, so they install from public npm.
      - name: Setup JFrog CLI with OIDC
        if: ${{ !github.event.pull_request.head.repo.fork }}
        id: setup-jfrog
        uses: jfrog/setup-jfrog-cli@279b1f629f43dd5bc658d8361ac4802a7ef8d2d5 # v4.9.1
        env:
          JF_URL: https://databricks.jfrog.io
        with:
          oidc-provider-name: github-actions
      - name: Configure npm registry (Databricks JFrog mirror)
        if: ${{ !github.event.pull_request.head.repo.fork }}
        run: |
          cat > ~/.npmrc <<EOF
          registry=https://databricks.jfrog.io/artifactory/api/npm/db-npm/
          //databricks.jfrog.io/artifactory/api/npm/db-npm/:_authToken=${{ steps.setup-jfrog.outputs.oidc-token }}
          always-auth=true
          EOF

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Check prompts and snapshots
        env:
          BASE: ${{ github.base_ref != '' && format('origin/{0}', github.base_ref) || 'origin/main' }}
        run: npx --no-install copybook check --base "$BASE"

      - name: Syntax-check shell blocks in changed prompts
        env:
          BASE: ${{ github.base_ref != '' && format('origin/{0}', github.base_ref) || 'origin/main' }}
        run: npx --no-install copybook test --changed --base "$BASE" --tier syntax

      - name: Build the report
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          BASE: ${{ github.base_ref != '' && format('origin/{0}', github.base_ref) || 'origin/main' }}
        run: |
          npx --no-install copybook report --base "$BASE" > "$RUNNER_TEMP/copybook-report.md"
          cat "$RUNNER_TEMP/copybook-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Post or update the report comment
        if: ${{ !cancelled() && steps.install.outcome == 'success' && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          comment_id="$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- copybook-report -->"))][0].id // empty')"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$comment_id" \
              -F body=@"$RUNNER_TEMP/copybook-report.md"
          else
            gh pr comment "$PR" --body-file "$RUNNER_TEMP/copybook-report.md"
          fi
