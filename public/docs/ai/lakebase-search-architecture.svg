    --caption: #61646b;
    --green: #00c98a;
    --green-text: #078345;
    --green-fill: rgba(0, 229, 153, 0.06);
  }
  :where(.dark) svg[data-name="search-wide"] {
    --line: #494b50;
    --label: #fafafa;
    --caption: #afb1b6;
    --green: #00e599;
    --green-text: #47d18c;
    --green-fill: rgba(0, 229, 153, 0.12);
  }
  @media (prefers-color-scheme: dark) {
    svg:root[data-name="search-wide"] {
      --line: #494b50;
      --label: #fafafa;
      --caption: #afb1b6;
      --green: #00e599;
      --green-text: #47d18c;
      --green-fill: rgba(0, 229, 153, 0.12);
    }
  }
</style>
