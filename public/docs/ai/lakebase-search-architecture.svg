<?xml version="1.0"?>
<svg viewBox="0 0 740 300" xmlns="http://www.w3.org/2000/svg" data-name="search-wide" width="740" height="300">
<defs></defs>
<style>
  svg[data-name="search-wide"] {
    --line: #c9cbcf;
