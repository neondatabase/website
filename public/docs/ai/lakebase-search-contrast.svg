<?xml version="1.0"?><svg viewBox="0 0 902 352" width="902" height="352" xmlns="http://www.w3.org/2000/svg" data-name="search-contrast" role="img" aria-label="Comparison: in traditional Postgres the search index sits in RAM on always-on compute, while in Lakebase Search the index lives in storage and stateless compute reads it on demand.">
  <defs></defs>
<style>
  svg[data-name="search-contrast"] {
    --line: #6E727A;
    --label: #71757B;
    --caption: #5D6168;
    --green: #18936B;
    --green-text: #16855F;
    --green-fill: rgba(24, 147, 107, 0.14);
    --grey-fill: rgba(110, 114, 122, 0.10);
  }
  :where(.dark) svg[data-name="search-contrast"] {
    --line: #8A8F98;
    --label: #FAFAFA;
    --caption: #AFB1B6;
    --green: #00E599;
    --green-text: #47D18C;
    --green-fill: rgba(0, 229, 153, 0.16);
    --grey-fill: rgba(175, 177, 182, 0.12);
  }
  @media (prefers-color-scheme: dark) {
    svg:root[data-name="search-contrast"] {
      --line: #8A8F98;
      --label: #FAFAFA;
      --caption: #AFB1B6;
      --green: #00E599;
      --green-text: #47D18C;
      --green-fill: rgba(0, 229, 153, 0.16);
      --grey-fill: rgba(175, 177, 182, 0.12);
    }
  }
</style>
  <g class="theme">
  
  <g id="ordinary">
    <text x="1" y="18" fill="var(--label, #71757B)" font-family="'Geist Mono', monospace" font-size="16" font-weight="500" letter-spacing="-0.3">traditional Postgres</text>
    <rect x="1" y="40" width="420" height="200" rx="2" fill="none" stroke="var(--line, #6E727A)" stroke-width="1.5"></rect>
    <text x="24" y="72" fill="var(--label, #71757B)" font-family="'Geist Mono', monospace" font-size="14" font-weight="500" letter-spacing="-0.3">compute</text>
    <text x="398" y="72" text-anchor="end" fill="var(--caption, #5D6168)" font-family="'Geist Mono', monospace" font-size="12" letter-spacing="-0.2">always on</text>
    <rect x="24" y="92" width="374" height="124" rx="2" fill="var(--grey-fill, rgba(110, 114, 122, 0.10))" stroke="var(--line, #6E727A)" stroke-width="1" stroke-dasharray="3 3"></rect>
    <text x="48" y="120" fill="var(--caption, #5D6168)" font-family="'Geist Mono', monospace" font-size="13" letter-spacing="-0.2">RAM</text>
    <rect x="250" y="110" width="120" height="10" rx="1" fill="none" stroke="var(--line, #6E727A)" stroke-width="1"></rect>
    <rect x="250" y="126" width="120" height="10" rx="1" fill="none" stroke="var(--line, #6E727A)" stroke-width="1"></rect>
    <rect x="250" y="142" width="120" height="10" rx="1" fill="none" stroke="var(--line, #6E727A)" stroke-width="1"></rect>
    <rect x="250" y="158" width="120" height="10" rx="1" fill="none" stroke="var(--line, #6E727A)" stroke-width="1"></rect>
    <rect x="250" y="174" width="120" height="10" rx="1" fill="none" stroke="var(--line, #6E727A)" stroke-width="1"></rect>
    <rect x="250" y="190" width="120" height="10" rx="1" fill="none" stroke="var(--line, #6E727A)" stroke-width="1"></rect>
    <text x="48" y="196" fill="var(--label, #71757B)" font-family="'Geist Mono', monospace" font-size="13" letter-spacing="-0.2">search index</text>
    <rect x="1" y="280" width="420" height="70" rx="2" fill="none" stroke="var(--line, #6E727A)" stroke-width="1.5"></rect>
    <text x="24" y="320" fill="var(--label, #71757B)" font-family="'Geist Mono', monospace" font-size="14" font-weight="500" letter-spacing="-0.3">storage</text>
    <text x="398" y="320" text-anchor="end" fill="var(--caption, #5D6168)" font-family="'Geist Mono', monospace" font-size="12" letter-spacing="-0.2">tables</text>
  </g>

  
  <g id="lakebase">
    <text x="481" y="18" fill="var(--green-text, #16855F)" font-family="'Geist Mono', monospace" font-size="16" font-weight="500" letter-spacing="-0.3">Lakebase Search</text>
    <rect x="481" y="40" width="420" height="120" rx="2" fill="none" stroke="var(--line, #6E727A)" stroke-width="1.5" stroke-dasharray="6 5"></rect>
    <text x="504" y="72" fill="var(--label, #71757B)" font-family="'Geist Mono', monospace" font-size="14" font-weight="500" letter-spacing="-0.3">compute</text>
    <text x="878" y="72" text-anchor="end" fill="var(--caption, #5D6168)" font-family="'Geist Mono', monospace" font-size="12" letter-spacing="-0.2">stateless</text>
    <rect x="504" y="92" width="374" height="44" rx="2" fill="none" stroke="var(--line, #6E727A)" stroke-width="1" stroke-dasharray="3 3"></rect>
    <text x="528" y="119" fill="var(--caption, #5D6168)" font-family="'Geist Mono', monospace" font-size="13" letter-spacing="-0.2">RAM</text>
    <line x1="810" y1="160" x2="810" y2="200" stroke="var(--green, #18936B)" stroke-width="1.5" stroke-dasharray="4 4"></line>
    <polygon points="810,210 805,200 815,200" fill="var(--green, #18936B)"></polygon>
    <text x="796" y="186" text-anchor="end" fill="var(--green-text, #16855F)" font-family="'Geist Mono', monospace" font-size="12" letter-spacing="-0.2">reads</text>
    <rect x="481" y="210" width="420" height="140" rx="2" fill="none" stroke="var(--green, #18936B)" stroke-width="1.5"></rect>
    <text x="504" y="242" fill="var(--green-text, #16855F)" font-family="'Geist Mono', monospace" font-size="14" font-weight="500" letter-spacing="-0.3">storage</text>
    <text x="878" y="242" text-anchor="end" fill="var(--caption, #5D6168)" font-family="'Geist Mono', monospace" font-size="12" letter-spacing="-0.2">tables</text>
    <rect x="730" y="252" width="120" height="10" rx="1" fill="var(--green-fill, rgba(24, 147, 107, 0.14))" stroke="var(--green, #18936B)" stroke-width="1"></rect>
    <rect x="730" y="268" width="120" height="10" rx="1" fill="var(--green-fill, rgba(24, 147, 107, 0.14))" stroke="var(--green, #18936B)" stroke-width="1"></rect>
    <rect x="730" y="284" width="120" height="10" rx="1" fill="var(--green-fill, rgba(24, 147, 107, 0.14))" stroke="var(--green, #18936B)" stroke-width="1"></rect>
    <rect x="730" y="300" width="120" height="10" rx="1" fill="var(--green-fill, rgba(24, 147, 107, 0.14))" stroke="var(--green, #18936B)" stroke-width="1"></rect>
    <rect x="730" y="316" width="120" height="10" rx="1" fill="var(--green-fill, rgba(24, 147, 107, 0.14))" stroke="var(--green, #18936B)" stroke-width="1"></rect>
    <rect x="730" y="332" width="120" height="10" rx="1" fill="var(--green-fill, rgba(24, 147, 107, 0.14))" stroke="var(--green, #18936B)" stroke-width="1"></rect>
    <text x="504" y="330" fill="var(--green-text, #16855F)" font-family="'Geist Mono', monospace" font-size="13" letter-spacing="-0.2">search index</text>
  </g>
  </g>
</svg>