<svg viewBox="0 0 560 260" width="560" height="260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="direct-connection-title">
  <title id="direct-connection-title">Direct connection: each app connection holds its own dedicated Postgres session, up to the compute’s connection limit.</title>
  <g id="app">
    <rect x="1" y="20" width="110" height="200" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"></rect>
    <text x="56" y="126" text-anchor="middle" fill="currentColor" font-family="'Geist Mono', ui-monospace, monospace" font-size="16" letter-spacing="-0.3" font-weight="500">your app</text>
  </g>
  <g id="sessions">
    <line x1="111" y1="75" x2="449" y2="75" stroke="currentColor" stroke-width="1.5"></line>
    <line x1="111" y1="105" x2="449" y2="105" stroke="currentColor" stroke-width="1.5"></line>
    <line x1="111" y1="135" x2="449" y2="135" stroke="currentColor" stroke-width="1.5"></line>
    <line x1="111" y1="165" x2="449" y2="165" stroke="currentColor" stroke-width="1.5"></line>
    <text x="280" y="246" text-anchor="middle" fill="currentColor" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" letter-spacing="-0.3" opacity="0.8">up to your compute’s limit</text>
  </g>
  <g id="postgres">
    <rect x="449" y="20" width="110" height="200" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"></rect>
    <text x="504" y="126" text-anchor="middle" fill="currentColor" font-family="'Geist Mono', ui-monospace, monospace" font-size="16" letter-spacing="-0.3" font-weight="500">Postgres</text>
  </g>
</svg>