<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" role="img" aria-labelledby="title desc">
  <title id="title">Atlas Architecture</title>
  <desc id="desc">The browser signs in with Managed Better Auth and calls TanStack Start server functions and API routes on Vercel with a Bearer JWT. The server verifies the JWT, queries Lakebase Postgres, and stores photos and face crops in Object Storage. The browser loads images with presigned URLs. Auth, Postgres, Lakebase Search, and Object Storage all sit on one Neon branch.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b9098"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#00e599"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .h1 { font-size: 30px; font-weight: 600; fill: #f5f5f5; }
      .col { font-size: 13px; font-weight: 600; letter-spacing: 0.12em; fill: #9a9ea6; }
      .ct { font-size: 17px; font-weight: 600; fill: #f0f0f0; }
      .cl { font-size: 14px; fill: #a6aab2; }
      .lbl { font-size: 14px; fill: #c3c6cc; }
      .lbl-g { font-size: 14px; fill: #00e599; }
      .column { fill: #121314; stroke: #26282b; stroke-width: 1; }
      .card { fill: #1a1b1d; stroke: #2e3034; stroke-width: 1; }
      .ncard { fill: #16201c; stroke: #1f4d3a; stroke-width: 1; }
      .edge { fill: none; stroke: #8b9098; stroke-width: 1.5; }
      .edge-g { fill: none; stroke: #00e599; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1600" height="700" fill="#0c0d0d"/>

  <!-- Atlas logo, from LandingArt in the Atlas app -->
  <g transform="translate(30 12) scale(0.48)">
    <rect x="20" y="34" width="70" height="58" rx="8" transform="rotate(-6 55 63)" stroke="#33363d" stroke-width="2" fill="#171a20"/>
    <g transform="rotate(5 66 64)">
      <rect x="34" y="38" width="70" height="58" rx="8" stroke="#fd9b4c" stroke-width="2" fill="#22252c"/>
      <circle cx="53" cy="57" r="6" fill="#fd9b4c"/>
      <path d="M40 88 60 68l12 11 10-8 12 12v5H40z" fill="#fd9b4c" fill-opacity="0.28" stroke="#fd9b4c" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <g transform="translate(86 78)">
      <circle cx="16" cy="16" r="20" fill="#0f1117" stroke="#00e599" stroke-width="2"/>
      <circle cx="16" cy="12" r="5" fill="none" stroke="#00e599" stroke-width="2"/>
      <path d="M6 27a10 10 0 0 1 20 0" fill="none" stroke="#00e599" stroke-width="2" stroke-linecap="round"/>
    </g>
    <path d="M96 30v10M91 35h10" stroke="#fd9b4c" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <text x="104" y="60" class="sans h1">Atlas<tspan fill="#fd9b4c">.</tspan> Architecture</text>

  <!-- Browser -->
  <rect x="40" y="140" width="360" height="460" rx="14" class="column"/>
  <g transform="translate(60 162) scale(1.125)" fill="none" stroke="#c3c6cc" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 15.5C9.775 15.5 11.214 12.142 11.214 8C11.214 3.858 9.775 0.5 8 0.5C6.225 0.5 4.786 3.858 4.786 8C4.786 12.142 6.225 15.5 8 15.5Z"/>
    <path d="M0.5 8H15.5"/>
    <circle cx="8" cy="8" r="7.5"/>
  </g>
  <text x="88" y="176" class="sans col">BROWSER</text>

  <rect x="60" y="200" width="320" height="80" rx="10" class="card"/>
  <text x="80" y="233" class="sans ct">Auth client</text>
  <text x="80" y="257" class="sans cl">Gets a short-lived JWT</text>

  <rect x="60" y="300" width="320" height="80" rx="10" class="card"/>
  <text x="80" y="333" class="sans ct">Library UI</text>
  <text x="80" y="357" class="sans cl">Upload and search</text>

  <rect x="60" y="400" width="320" height="80" rx="10" class="card"/>
  <text x="80" y="433" class="sans ct">Face detection</text>
  <text x="80" y="457" class="sans cl">Runs on WebGL</text>

  <rect x="60" y="500" width="320" height="80" rx="10" class="card"/>
  <text x="80" y="533" class="sans ct">Images</text>
  <text x="80" y="557" class="sans cl">Shown from presigned URLs</text>

  <!-- Vercel -->
  <rect x="560" y="140" width="460" height="460" rx="14" class="column"/>
  <path d="M589 162L599 179H579L589 162Z" fill="#ffffff"/>
  <text x="608" y="176" class="sans col">VERCEL</text>

  <rect x="580" y="200" width="420" height="80" rx="10" class="card"/>
  <text x="600" y="233" class="sans ct">Auth middleware</text>
  <text x="600" y="257" class="sans cl">Verifies the JWT, sets the owner</text>

  <rect x="580" y="300" width="420" height="80" rx="10" class="card"/>
  <text x="600" y="333" class="sans ct">Server functions</text>
  <text x="600" y="357" class="sans cl">Owner-scoped reads and search</text>

  <rect x="580" y="400" width="420" height="80" rx="10" class="card"/>
  <text x="600" y="433" class="sans ct">API routes</text>
  <text x="600" y="457" class="sans cl">Upload, caption, embed, faces</text>

  <rect x="580" y="500" width="420" height="80" rx="10" class="card"/>
  <text x="600" y="533" class="sans ct">Models</text>
  <text x="600" y="557" class="sans cl">CLIP and ViT-GPT2</text>

  <!-- Neon branch -->
  <rect x="1180" y="125" width="380" height="490" rx="16" fill="#0f1a16" stroke="#00e599" stroke-width="1.5" stroke-dasharray="7 6"/>
  <path transform="translate(1200 162) scale(0.28)" d="M63 0.0177909V63.5526L38.4178 42.2501V63.5526H0V0L63 0.0177909ZM7.72251 55.8389H30.6953V25.3238L55.2779 47.0476V7.72922L7.72251 7.71559V55.8389Z" fill="#34D59A"/>
  <text x="1228" y="176" class="sans col" style="fill:#00e599">NEON BRANCH</text>

  <rect x="1200" y="200" width="340" height="80" rx="10" class="ncard"/>
  <text x="1220" y="233" class="sans ct">Managed Better Auth</text>
  <text x="1220" y="257" class="sans cl">Users and sessions</text>

  <rect x="1200" y="300" width="340" height="80" rx="10" class="ncard"/>
  <text x="1220" y="333" class="sans ct">Lakebase Postgres</text>
  <text x="1220" y="357" class="sans cl">Photos, faces, people</text>

  <line x1="1370" y1="380" x2="1370" y2="400" stroke="#1f4d3a" stroke-width="1.5"/>

  <rect x="1200" y="400" width="340" height="80" rx="10" class="ncard"/>
  <text x="1220" y="433" class="sans ct">Lakebase Search</text>
  <text x="1220" y="457" class="sans cl">Vector index on photos</text>

  <rect x="1200" y="500" width="340" height="80" rx="10" class="ncard"/>
  <text x="1220" y="533" class="sans ct">Object Storage</text>
  <text x="1220" y="557" class="sans cl">Private photos bucket</text>

  <!-- Edges -->
  <path d="M300 140 V100 H1460 V198" class="edge-g" marker-end="url(#arrow-green)"/>
  <text x="880" y="90" text-anchor="middle" class="sans lbl-g">sign in</text>

  <path d="M382 340 H578" class="edge" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="470" y="328" text-anchor="middle" class="sans lbl">Bearer JWT</text>

  <path d="M380 440 H578" class="edge" marker-end="url(#arrow)"/>
  <text x="470" y="428" text-anchor="middle" class="sans lbl">photos, faces</text>

  <path d="M1000 240 H1198" class="edge-g" marker-end="url(#arrow-green)"/>
  <text x="1090" y="228" text-anchor="middle" class="sans lbl-g">verify JWT</text>

  <path d="M1000 340 H1198" class="edge-g" marker-end="url(#arrow-green)"/>
  <text x="1090" y="328" text-anchor="middle" class="sans lbl-g">SQL</text>

  <path d="M1000 420 H1090 V360 H1198" class="edge-g" marker-end="url(#arrow-green)"/>

  <path d="M1000 460 H1110 V540 H1198" class="edge-g" marker-end="url(#arrow-green)"/>
  <text x="1055" y="500" text-anchor="middle" class="sans lbl-g">PUT</text>

  <path d="M1370 580 V650 H220 V582" class="edge-g" marker-end="url(#arrow-green)"/>
  <text x="795" y="675" text-anchor="middle" class="sans lbl-g">presigned URLs</text>
</svg>
